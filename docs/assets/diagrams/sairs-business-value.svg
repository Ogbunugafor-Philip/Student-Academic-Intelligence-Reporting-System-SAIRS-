<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">How SAIRS Creates Operational Value</title><desc id="desc">Six connected value areas: process efficiency, data accuracy, management oversight, record continuity, stakeholder access, and workflow coordination.</desc>
<defs><linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#FFFDF8"/><stop offset="1" stop-color="#EEF4F1"/></linearGradient><linearGradient id="core" x2="100%" y2="100%"><stop stop-color="#17231F"/><stop offset="1" stop-color="#315C4C"/></linearGradient><filter id="s"><feDropShadow dy="9" stdDeviation="13" flood-color="#17231F" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="900" rx="32" fill="#FFFDF8"/><text x="720" y="74" text-anchor="middle" fill="#17231F" font-family="Arial,sans-serif" font-size="38" font-weight="700">How SAIRS Creates Operational Value</text><text x="720" y="112" text-anchor="middle" fill="#66756F" font-family="Arial,sans-serif" font-size="17">Implemented capabilities translated into practical benefits—not measured financial outcomes</text>
<g fill="none" stroke="#9B7B45" stroke-width="3" opacity=".55"><path d="M720 450L360 280M720 450L1080 280M720 450L360 620M720 450L1080 620M720 450L720 230M720 450L720 690"/></g>
<g filter="url(#s)"><circle cx="720" cy="450" r="142" fill="#315C4C"/><circle cx="720" cy="450" r="110" fill="none" stroke="#9B7B45" stroke-width="2"/><text x="720" y="424" text-anchor="middle" fill="#DCE8E2" font-family="Arial,sans-serif" font-size="14" font-weight="700">CONNECTED ACADEMIC</text><text x="720" y="458" text-anchor="middle" fill="#FFFDF8" font-family="Arial,sans-serif" font-size="34" font-weight="700">OPERATIONAL</text><text x="720" y="494" text-anchor="middle" fill="#FFFDF8" font-family="Arial,sans-serif" font-size="34" font-weight="700">VALUE</text></g>
<g font-family="Arial,sans-serif" filter="url(#s)">
<g transform="translate(105 170)"><rect width="430" height="190" rx="24" fill="#FFFDF8" stroke="#D8E7E0"/><circle cx="62" cy="60" r="31" fill="#DCE8E2"/><path d="M46 61h32M52 49l-7 12 7 12M72 49l7 12-7 12" fill="none" stroke="#315C4C" stroke-width="4" stroke-linecap="round"/><text x="110" y="52" fill="#17231F" font-size="19" font-weight="700">PROCESS EFFICIENCY</text><text x="110" y="77" fill="#9B7B45" font-size="12" font-weight="700">CAPABILITY → BENEFIT</text><text x="34" y="120" fill="#315C4C" font-size="15">Automated calculations and organised workflows</text><text x="34" y="148" fill="#17231F" font-size="14">reduce repeated handling and coordinate each stage.</text></g>
<g transform="translate(905 170)"><rect width="430" height="190" rx="24" fill="#FFFDF8" stroke="#D8E3EA"/><circle cx="62" cy="60" r="31" fill="#E2EEF4"/><path d="M46 61l10 10 22-25" fill="none" stroke="#4F8195" stroke-width="5" stroke-linecap="round"/><text x="110" y="52" fill="#17231F" font-size="19" font-weight="700">DATA ACCURACY</text><text x="110" y="77" fill="#4F8195" font-size="12" font-weight="700">CAPABILITY → BENEFIT</text><text x="34" y="120" fill="#315C4C" font-size="15">Validation and consistent academic rules</text><text x="34" y="148" fill="#17231F" font-size="14">help identify invalid or incomplete information.</text></g>
<g transform="translate(105 540)"><rect width="430" height="190" rx="24" fill="#FFFDF8" stroke="#E9DDC7"/><circle cx="62" cy="60" r="31" fill="#F1E8D9"/><path d="M44 68c10-22 26-22 36 0M51 49h22M56 42h12" fill="none" stroke="#9B7B45" stroke-width="4"/><text x="110" y="52" fill="#17231F" font-size="19" font-weight="700">MANAGEMENT OVERSIGHT</text><text x="110" y="77" fill="#9B7B45" font-size="12" font-weight="700">CAPABILITY → BENEFIT</text><text x="34" y="120" fill="#315C4C" font-size="15">Structured review, return and approval</text><text x="34" y="148" fill="#17231F" font-size="14">strengthen control before academic publication.</text></g>
<g transform="translate(905 540)"><rect width="430" height="190" rx="24" fill="#FFFDF8" stroke="#E2DCE9"/><circle cx="62" cy="60" r="31" fill="#EEE8F4"/><path d="M46 47h32v28H46zM53 55h18M53 63h14M42 43h32" fill="none" stroke="#6D5B7B" stroke-width="3"/><text x="110" y="52" fill="#17231F" font-size="19" font-weight="700">RECORD CONTINUITY</text><text x="110" y="77" fill="#6D5B7B" font-size="12" font-weight="700">CAPABILITY → BENEFIT</text><text x="34" y="120" fill="#315C4C" font-size="15">Session history and versioned reports</text><text x="34" y="148" fill="#17231F" font-size="14">preserve academic context across school years.</text></g>
<g transform="translate(505 135)"><rect width="430" height="142" rx="24" fill="#FFFDF8" stroke="#CFE2DB"/><circle cx="57" cy="55" r="28" fill="#DCE8E2"/><circle cx="49" cy="49" r="8" fill="none" stroke="#315C4C" stroke-width="3"/><circle cx="66" cy="49" r="8" fill="none" stroke="#315C4C" stroke-width="3"/><path d="M39 70c5-12 31-12 37 0" fill="none" stroke="#315C4C" stroke-width="3"/><text x="100" y="48" fill="#17231F" font-size="18" font-weight="700">STAKEHOLDER ACCESS</text><text x="100" y="73" fill="#315C4C" font-size="13">Controlled access to relevant, approved information</text><text x="36" y="112" fill="#66756F" font-size="13">Families see linked children; staff work within responsibility.</text></g>
<g transform="translate(505 685)"><rect width="430" height="142" rx="24" fill="#FFFDF8" stroke="#D8E3EA"/><circle cx="57" cy="55" r="28" fill="#E2EEF4"/><circle cx="44" cy="55" r="7" fill="#4F8195"/><circle cx="70" cy="42" r="7" fill="#4F8195"/><circle cx="70" cy="68" r="7" fill="#4F8195"/><path d="M51 52l12-7M51 58l12 7" stroke="#4F8195" stroke-width="4"/><text x="100" y="48" fill="#17231F" font-size="18" font-weight="700">WORKFLOW COORDINATION</text><text x="100" y="73" fill="#315C4C" font-size="13">Clearly defined responsibilities and hand-offs</text><text x="36" y="112" fill="#66756F" font-size="13">Capture, compilation, review and publication remain accountable.</text></g></g>
<text x="720" y="870" text-anchor="middle" fill="#66756F" font-family="Arial,sans-serif" font-size="13">Operational benefits are supported by implemented features; no time, cost or performance improvement is claimed as measured.</text>
</svg>
