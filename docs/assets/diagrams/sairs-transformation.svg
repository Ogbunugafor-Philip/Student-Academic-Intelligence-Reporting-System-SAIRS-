<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Transforming Academic Administration</title><desc id="desc">A comparison between the general fragmented process challenge and the connected SAIRS digital workflow.</desc>
<defs><linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#FFFDF8"/><stop offset="1" stop-color="#F4F1EA"/></linearGradient><linearGradient id="right" x2="100%" y2="100%"><stop stop-color="#E7F1ED"/><stop offset="1" stop-color="#DDECF2"/></linearGradient><filter id="s"><feDropShadow dy="8" stdDeviation="12" flood-color="#17231F" flood-opacity=".1"/></filter></defs>
<rect width="1440" height="820" rx="32" fill="#FFFDF8"/><text x="720" y="70" text-anchor="middle" fill="#17231F" font-family="Arial,sans-serif" font-size="36" font-weight="700">Transforming Academic Administration</text><text x="720" y="105" text-anchor="middle" fill="#66756F" font-family="Arial,sans-serif" font-size="17">From a fragmented process challenge to an organised, role-led digital workflow</text>
<g transform="translate(70 145)" font-family="Arial,sans-serif"><rect width="585" height="600" rx="28" fill="#ECE9E3"/><rect width="585" height="86" rx="28" fill="#DDD8CF"/><rect y="58" width="585" height="28" fill="#DDD8CF"/><circle cx="50" cy="42" r="20" fill="#A49D91"/><path d="M40 42h20M50 32v20" stroke="#FFFDF8" stroke-width="4"/><text x="84" y="39" fill="#4F4A43" font-size="15" font-weight="700">BEFORE</text><text x="84" y="63" fill="#4F4A43" font-size="20" font-weight="700">MANUAL / FRAGMENTED PROCESS</text>
<g fill="#FFFDF8" filter="url(#s)"><rect x="38" y="120" width="509" height="76" rx="16"/><rect x="38" y="214" width="509" height="76" rx="16"/><rect x="38" y="308" width="509" height="76" rx="16"/><rect x="38" y="402" width="509" height="76" rx="16"/><rect x="38" y="496" width="509" height="76" rx="16"/></g>
<g fill="#4F4A43" font-size="17"><text x="85" y="153" font-weight="700">Repetitive assessment calculations</text><text x="85" y="177" font-size="13">The same academic figures may require repeated handling.</text><text x="85" y="247" font-weight="700">Separate academic records</text><text x="85" y="271" font-size="13">People, classes and results can become disconnected.</text><text x="85" y="341" font-weight="700">Manual report preparation</text><text x="85" y="365" font-size="13">Collation and presentation require additional effort.</text><text x="85" y="435" font-weight="700">Multiple coordination steps</text><text x="85" y="459" font-size="13">Ownership and review hand-offs may be unclear.</text><text x="85" y="529" font-weight="700">Difficult historical retrieval</text><text x="85" y="553" font-size="13">Earlier context can be difficult to reconstruct.</text></g>
<g fill="none" stroke="#A49D91" stroke-width="3"><path d="M58 144l14 14-14 14M58 238l14 14-14 14M58 332l14 14-14 14M58 426l14 14-14 14M58 520l14 14-14 14"/></g></g>
<g transform="translate(785 145)" font-family="Arial,sans-serif"><rect width="585" height="600" rx="28" fill="#E7F1ED"/><rect width="585" height="86" rx="28" fill="#315C4C"/><rect y="58" width="585" height="28" fill="#315C4C"/><circle cx="50" cy="42" r="20" fill="#9B7B45"/><path d="M39 43l8 8 15-19" fill="none" stroke="#FFFDF8" stroke-width="4" stroke-linecap="round"/><text x="84" y="39" fill="#DCE8E2" font-size="15" font-weight="700">AFTER</text><text x="84" y="63" fill="#FFFDF8" font-size="20" font-weight="700">SAIRS DIGITAL WORKFLOW</text>
<g fill="#FFFDF8" filter="url(#s)"><rect x="38" y="111" width="509" height="67" rx="16"/><rect x="38" y="192" width="509" height="67" rx="16"/><rect x="38" y="273" width="509" height="67" rx="16"/><rect x="38" y="354" width="509" height="67" rx="16"/><rect x="38" y="435" width="509" height="67" rx="16"/><rect x="38" y="516" width="509" height="67" rx="16"/></g>
<g fill="#17231F" font-size="16"><text x="86" y="138" font-weight="700">Structured assessment recording</text><text x="86" y="160" font-size="13" fill="#315C4C">Assigned users work within a defined academic context.</text><text x="86" y="219" font-weight="700">Automated result calculations</text><text x="86" y="241" font-size="13" fill="#315C4C">Totals, grades, averages and positions follow set rules.</text><text x="86" y="300" font-weight="700">Centralised academic records</text><text x="86" y="322" font-size="13" fill="#315C4C">People, periods and results share one information flow.</text><text x="86" y="381" font-weight="700">Defined review and approval</text><text x="86" y="403" font-size="13" fill="#315C4C">Decisions and return paths have clear owners.</text><text x="86" y="462" font-weight="700">Digital report publication</text><text x="86" y="484" font-size="13" fill="#315C4C">Approved records become controlled family reports.</text><text x="86" y="543" font-weight="700">Accessible academic history</text><text x="86" y="565" font-size="13" fill="#315C4C">Session context and published versions are preserved.</text></g>
<g fill="#9B7B45"><circle cx="59" cy="145" r="10"/><circle cx="59" cy="226" r="10"/><circle cx="59" cy="307" r="10"/><circle cx="59" cy="388" r="10"/><circle cx="59" cy="469" r="10"/><circle cx="59" cy="550" r="10"/></g></g>
<path d="M680 440h74" stroke="#9B7B45" stroke-width="6" stroke-linecap="round"/><path d="m740 423 20 17-20 17" fill="none" stroke="#9B7B45" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="720" y="790" text-anchor="middle" fill="#66756F" font-family="Arial,sans-serif" font-size="13">The “before” state represents the general workflow problem SAIRS was designed to address—not a measured observation of a named school.</text>
</svg>
