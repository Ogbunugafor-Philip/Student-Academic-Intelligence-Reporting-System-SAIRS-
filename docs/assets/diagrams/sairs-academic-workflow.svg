<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="760" viewBox="0 0 1680 760" role="img" aria-labelledby="title desc">
<title id="title">From Assessment to Academic Report</title><desc id="desc">Seven-stage academic workflow from configuration through assessment, automated processing, compilation, management approval, publication, and parent access.</desc>
<defs><linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#17231F"/><stop offset="1" stop-color="#263F36"/></linearGradient><filter id="s"><feDropShadow dy="12" stdDeviation="15" flood-color="#07100D" flood-opacity=".3"/></filter></defs>
<rect width="1680" height="760" rx="34" fill="#17231F"/><circle cx="90" cy="60" r="260" fill="#DCE8E2" opacity=".04"/><circle cx="1600" cy="700" r="300" fill="#9B7B45" opacity=".08"/>
<text x="840" y="72" text-anchor="middle" fill="#FFFDF8" font-family="Arial,sans-serif" font-size="38" font-weight="700">From Assessment to Academic Report</text><text x="840" y="110" text-anchor="middle" fill="#DCE8E2" font-family="Arial,sans-serif" font-size="17">A coordinated journey combining accountable decisions with consistent automated processing</text>
<path d="M140 333H1540" stroke="#9B7B45" stroke-width="5" stroke-linecap="round" opacity=".85"/>
<g font-family="Arial,sans-serif" filter="url(#s)">
<g transform="translate(52 190)"><rect width="210" height="286" rx="24" fill="#FFFDF8"/><rect width="210" height="10" rx="5" fill="#9B7B45"/><circle cx="105" cy="76" r="35" fill="#F1E8D9"/><path d="M88 88h34M92 84V62h26v22M99 62v-9h12v9" fill="none" stroke="#9B7B45" stroke-width="4"/><text x="105" y="137" text-anchor="middle" fill="#9B7B45" font-size="12" font-weight="700">01 · HUMAN</text><text x="105" y="170" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Academic</text><text x="105" y="194" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Configuration</text><text x="105" y="231" text-anchor="middle" fill="#315C4C" font-size="13">Set periods, classes,</text><text x="105" y="251" text-anchor="middle" fill="#315C4C" font-size="13">subjects and rules</text></g>
<g transform="translate(280 190)"><rect width="210" height="286" rx="24" fill="#FFFDF8"/><rect width="210" height="10" rx="5" fill="#4F8195"/><circle cx="105" cy="76" r="35" fill="#E2EEF4"/><path d="M90 61h30v31H90zM97 70h16M97 79h16" fill="none" stroke="#4F8195" stroke-width="4"/><text x="105" y="137" text-anchor="middle" fill="#4F8195" font-size="12" font-weight="700">02 · HUMAN</text><text x="105" y="170" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Assessment</text><text x="105" y="194" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Recording</text><text x="105" y="231" text-anchor="middle" fill="#315C4C" font-size="13">Teachers save and</text><text x="105" y="251" text-anchor="middle" fill="#315C4C" font-size="13">submit CA1, CA2, Exam</text></g>
<g transform="translate(508 190)"><rect width="210" height="286" rx="24" fill="#DCE8E2"/><rect width="210" height="10" rx="5" fill="#315C4C"/><circle cx="105" cy="76" r="35" fill="#315C4C"/><path d="M87 84l12-15 11 9 14-20M88 91h35" fill="none" stroke="#FFFDF8" stroke-width="4" stroke-linecap="round"/><text x="105" y="137" text-anchor="middle" fill="#315C4C" font-size="12" font-weight="700">03 · AUTOMATED</text><text x="105" y="170" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Result</text><text x="105" y="194" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Processing</text><text x="105" y="231" text-anchor="middle" fill="#315C4C" font-size="13">Validate, calculate,</text><text x="105" y="251" text-anchor="middle" fill="#315C4C" font-size="13">grade and check</text></g>
<g transform="translate(736 190)"><rect width="210" height="286" rx="24" fill="#FFFDF8"/><rect width="210" height="10" rx="5" fill="#6D5B7B"/><circle cx="105" cy="76" r="35" fill="#EEE8F4"/><path d="M88 90h34V59H88zM95 68h20M95 77h20M95 86h12" fill="none" stroke="#6D5B7B" stroke-width="4"/><text x="105" y="137" text-anchor="middle" fill="#6D5B7B" font-size="12" font-weight="700">04 · HUMAN + SYSTEM</text><text x="105" y="170" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Result</text><text x="105" y="194" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Compilation</text><text x="105" y="231" text-anchor="middle" fill="#315C4C" font-size="13">Confirm completeness,</text><text x="105" y="251" text-anchor="middle" fill="#315C4C" font-size="13">compile and rank</text></g>
<g transform="translate(964 190)"><rect width="210" height="286" rx="24" fill="#FFFDF8"/><rect width="210" height="10" rx="5" fill="#9B7B45"/><circle cx="105" cy="76" r="35" fill="#F1E8D9"/><path d="M88 76l10 10 25-26" fill="none" stroke="#9B7B45" stroke-width="5" stroke-linecap="round"/><text x="105" y="137" text-anchor="middle" fill="#9B7B45" font-size="12" font-weight="700">05 · HUMAN APPROVAL</text><text x="105" y="170" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Management</text><text x="105" y="194" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Review</text><text x="105" y="231" text-anchor="middle" fill="#315C4C" font-size="13">Review, return or</text><text x="105" y="251" text-anchor="middle" fill="#315C4C" font-size="13">approve the class record</text></g>
<g transform="translate(1192 190)"><rect width="210" height="286" rx="24" fill="#DCE8E2"/><rect width="210" height="10" rx="5" fill="#315C4C"/><circle cx="105" cy="76" r="35" fill="#315C4C"/><path d="M87 63h36v26H87zM94 70h22M94 78h16M115 89v9m-8-4 8 4 8-4" fill="none" stroke="#FFFDF8" stroke-width="4"/><text x="105" y="137" text-anchor="middle" fill="#315C4C" font-size="12" font-weight="700">06 · AUTOMATED</text><text x="105" y="170" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Result</text><text x="105" y="194" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Publication</text><text x="105" y="231" text-anchor="middle" fill="#315C4C" font-size="13">Create versioned report,</text><text x="105" y="251" text-anchor="middle" fill="#315C4C" font-size="13">PDF and verification</text></g>
<g transform="translate(1420 190)"><rect width="210" height="286" rx="24" fill="#FFFDF8"/><rect width="210" height="10" rx="5" fill="#4F8195"/><circle cx="105" cy="76" r="35" fill="#E2EEF4"/><circle cx="96" cy="69" r="9" fill="none" stroke="#4F8195" stroke-width="4"/><circle cx="115" cy="69" r="9" fill="none" stroke="#4F8195" stroke-width="4"/><path d="M83 91c4-11 12-15 22-15s18 4 22 15" fill="none" stroke="#4F8195" stroke-width="4"/><text x="105" y="137" text-anchor="middle" fill="#4F8195" font-size="12" font-weight="700">07 · HUMAN ACCESS</text><text x="105" y="170" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Parent / Guardian</text><text x="105" y="194" text-anchor="middle" fill="#17231F" font-size="19" font-weight="700">Access</text><text x="105" y="231" text-anchor="middle" fill="#315C4C" font-size="13">View, print, download</text><text x="105" y="251" text-anchor="middle" fill="#315C4C" font-size="13">or verify reports</text></g></g>
<g fill="#9B7B45"><circle cx="271" cy="333" r="8"/><circle cx="499" cy="333" r="8"/><circle cx="727" cy="333" r="8"/><circle cx="955" cy="333" r="8"/><circle cx="1183" cy="333" r="8"/><circle cx="1411" cy="333" r="8"/></g>
<path d="M1069 495C1069 610 385 610 385 495" fill="none" stroke="#C4A873" stroke-width="3" stroke-dasharray="8 10"/><path d="m373 510 12-17 12 17" fill="none" stroke="#C4A873" stroke-width="3"/><text x="727" y="645" text-anchor="middle" fill="#DCE8E2" font-family="Arial,sans-serif" font-size="14">Returned work follows a controlled correction and resubmission path</text>
